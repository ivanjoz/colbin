syntax = "proto3";

package colbin.corpus;

option go_package = "github.com/ivanjoz/colbin/bench";

// Generated by internal/protogen. That program is the source of
// truth; this file is documentation and is never parsed.

message CorpusUser {
  uint32 id = 1;
  string name = 2;
  string email = 3;
  string country = 4;
  uint32 age = 5;
  bool active = 6;
  int64 created_at = 7;
}

message CorpusProduct {
  uint32 id = 1;
  string sku = 2;
  string name = 3;
  int64 price_cents = 4;
  uint32 stock = 5;
  uint32 category_id = 6;
  repeated string tags = 7;
}

message CorpusCategory {
  uint32 id = 1;
  string name = 2;
  uint32 parent_id = 3;
}

message CorpusStore {
  uint32 id = 1;
  string code = 2;
  string city = 3;
  double lat = 4;
  double lon = 5;
}

message CorpusSaleLine {
  uint32 product_id = 1;
  uint32 quantity = 2;
  int64 unit_cents = 3;
  uint32 discount_bp = 4;
  uint32 tax_bp = 5;
  int64 total_cents = 6;
}

message CorpusSale {
  uint64 id = 1;
  uint32 user_id = 2;
  uint32 store_id = 3;
  int64 created_at = 4;
  int64 subtotal_cents = 5;
  int64 tax_cents = 6;
  int64 total_cents = 7;
  int64 paid_cents = 8;
  repeated CorpusSaleLine detail = 9;
}

message CorpusMetric {
  uint32 series_id = 1;
  int64 at = 2;
  int64 value = 3;
}

