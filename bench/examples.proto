syntax = "proto3";

package colbin.comparison;

option go_package = "github.com/ivanjoz/colbin/comparison";

// The twenty-one messages below form a deliberately varied serialization corpus.
// They cover scalar columns, repeated values, bytes, maps, and nested messages.

message Address {
  string street = 1;
  string city = 2;
  string country = 3;
  string postal_code = 4;
  double latitude = 5;
  double longitude = 6;
}

message Person {
  uint64 id = 1;
  string name = 2;
  uint32 age = 3;
  bool active = 4;
  repeated string emails = 5;
  Address address = 6;
  bytes avatar_hash = 7;
}

message Company {
  uint64 id = 1;
  string name = 2;
  string industry = 3;
  repeated Person employees = 4;
  map<string, string> labels = 5;
}

message Product {
  uint64 id = 1;
  string sku = 2;
  string name = 3;
  sint64 price_cents = 4;
  uint32 stock = 5;
  repeated string categories = 6;
  map<string, string> attributes = 7;
}

message OrderLine {
  Product product = 1;
  uint32 quantity = 2;
  sint64 unit_price_cents = 3;
  repeated sint32 discount_bps = 4;
}

message Order {
  uint64 id = 1;
  Person customer = 2;
  repeated OrderLine lines = 3;
  Address shipping_address = 4;
  string status = 5;
  int64 created_unix = 6;
}

message Invoice {
  string number = 1;
  Order order = 2;
  sint64 subtotal_cents = 3;
  sint64 tax_cents = 4;
  sint64 total_cents = 5;
  bool paid = 6;
  repeated string notes = 7;
}

message SensorReading {
  uint64 sensor_id = 1;
  int64 timestamp_unix_ms = 2;
  double value = 3;
  string unit = 4;
  repeated sint32 samples = 5;
  bool valid = 6;
}

message WeatherSample {
  string station = 1;
  int64 timestamp_unix = 2;
  float temperature_c = 3;
  float humidity_percent = 4;
  float wind_kph = 5;
  repeated SensorReading sensors = 6;
}

message GeoPoint {
  double latitude = 1;
  double longitude = 2;
  sint32 elevation_m = 3;
  string label = 4;
}

message Route {
  uint64 id = 1;
  string name = 2;
  repeated GeoPoint points = 3;
  repeated uint32 segment_durations_sec = 4;
  bool toll = 5;
}

message BlogPost {
  uint64 id = 1;
  Person author = 2;
  string title = 3;
  string body = 4;
  repeated string tags = 5;
  int64 published_unix = 6;
}

message Comment {
  uint64 id = 1;
  uint64 post_id = 2;
  Person author = 3;
  string body = 4;
  repeated uint64 reply_ids = 5;
  bool moderated = 6;
}

message UserProfile {
  Person person = 1;
  string biography = 2;
  repeated string interests = 3;
  map<string, string> preferences = 4;
  repeated Address previous_addresses = 5;
}

message GamePlayer {
  uint64 id = 1;
  string handle = 2;
  sint32 rating = 3;
  repeated sint32 recent_scores = 4;
  map<string, uint32> inventory = 5;
}

message GameMatch {
  uint64 id = 1;
  repeated GamePlayer players = 2;
  repeated uint32 round_durations_ms = 3;
  uint64 winner_id = 4;
  string map_name = 5;
}

message MetricPoint {
  int64 timestamp_unix_ms = 1;
  double value = 2;
  repeated string annotations = 3;
}

message MetricSeries {
  string name = 1;
  map<string, string> dimensions = 2;
  repeated MetricPoint points = 3;
  string unit = 4;
}

message LogEvent {
  int64 timestamp_unix_ms = 1;
  string level = 2;
  string message = 3;
  map<string, string> fields = 4;
  bytes trace_id = 5;
  repeated string stack_frames = 6;
}

message PortfolioPosition {
  string symbol = 1;
  sint64 quantity_micros = 2;
  sint64 cost_basis_micros = 3;
  double market_price = 4;
  repeated sint64 daily_pnl_micros = 5;
}

message Portfolio {
  uint64 account_id = 1;
  Person owner = 2;
  repeated PortfolioPosition positions = 3;
  map<string, sint64> cash_micros = 4;
  int64 updated_unix = 5;
}

// BenchmarkCorpus batches every example type so Colbin can use its intended
// columnar slice layout while Protobuf uses its normal repeated-message layout.
message BenchmarkCorpus {
  repeated Address addresses = 1;
  repeated Person people = 2;
  repeated Company companies = 3;
  repeated Product products = 4;
  repeated OrderLine order_lines = 5;
  repeated Order orders = 6;
  repeated Invoice invoices = 7;
  repeated SensorReading sensor_readings = 8;
  repeated WeatherSample weather_samples = 9;
  repeated GeoPoint geo_points = 10;
  repeated Route routes = 11;
  repeated BlogPost blog_posts = 12;
  repeated Comment comments = 13;
  repeated UserProfile user_profiles = 14;
  repeated GamePlayer game_players = 15;
  repeated GameMatch game_matches = 16;
  repeated MetricPoint metric_points = 17;
  repeated MetricSeries metric_series = 18;
  repeated LogEvent log_events = 19;
  repeated PortfolioPosition portfolio_positions = 20;
  repeated Portfolio portfolios = 21;
}
