[package]
name = "colbin"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "The colbin binary format: a byte-aligned [key][descriptor][payload] wire, a blocked column codec, and the packed5 string codec"
license = "MIT"
repository = "https://github.com/ivanjoz/colbin"
readme = "README.md"

# No runtime dependencies: this crate is a wire format, and a wire format that
# drags a dependency tree behind it is one more thing to keep in step with
# whatever else the consumer links.
[dependencies]
# The derive macro, which is a procedural macro and so has to be its own crate.
# Optional: a consumer who does not derive links neither it nor the three
# build-time crates it needs, which is what keeps the "no dependencies" promise
# above true for everyone who does not opt in.
colbin-derive = { version = "0.2", path = "derive", optional = true }

[features]
# `std` is on by default so an ordinary Rust consumer gets `Error: std::error::Error`
# and `?` into a `Box<dyn Error>` without asking. It is the only thing in the
# crate that touches the standard library; everything else is `core` + `alloc`,
# which is what lets `rust/wasm` build this with `default-features = false` and
# link no standard library at all.
default = ["std", "encode"]
std = []
# Only the macro is optional. The `Colbin` trait and the readers and writers it
# generates against are always present, so a caller can hand-write an impl
# without pulling in a proc-macro toolchain.
derive = ["dep:colbin-derive"]
# "JSON text in, colbin bytes out": the scanner, the type inference, the
# plan-driven build and the self-check. It is the one thing colbin does that
# needs no type at compile time, which is what a browser wants and what a
# service accepting a document from a client wants.
#
# On by default, because an ordinary consumer should not have to ask for the
# whole crate. Off is for the build that only reads — the wasm decoder next
# door, which would otherwise link a float *parser* beside the float formatter
# it already carries and pay for it in bytes downloaded before the page can do
# anything.
encode = []

[dev-dependencies]
# Only the cross-language vector corpus needs this; a consumer sees neither it
# nor the corpus.
serde_json = "1.0"

# Every test drives the derive, which is what the generated encode and decode
# are. Declared here rather than cfg'd inside each file, so `--all-targets`
# without the feature simply does not build them.
[[test]]
name = "derive"
required-features = ["derive"]

[[test]]
name = "vectors"
required-features = ["derive"]
