# Cargo workspace for the Rust port. The repository is primarily a Go module;
# the two build systems share the tree without either noticing the other, and a
# `cargo` dependency on this repo resolves the member below by name.
[workspace]
resolver = "3"
members = ["rust", "rust/derive"]
# rust/wasm is a workspace of its own — see the note in its Cargo.toml. It is
# built explicitly for wasm32-unknown-unknown, not as part of a host build.
exclude = ["rust/wasm"]
